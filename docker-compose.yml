services:
  melokeep-webui:
    container_name: melokeep
    image: ghcr.io/agonie0v0/melokeep:latest
    restart: unless-stopped
    init: true
    ports:
      - "8765:8765"
    volumes:
      - ./music:/music
      - ./data:/data
      # - /var/run/docker.sock:/var/run/docker.sock # 可选：取消注释以启用 Web 端单容器一键更新
    environment:
      MELOKEEP_USER: admin
      MELOKEEP_PASS: '请改成你自己的密码'
      # 默认以 10001:10001 运行；若 NAS 有专用读写用户或需以 root (0:0) 运行，取消注释并填入对应 UID/GID：
      # PUID: '1000'
      # PGID: '1000'
